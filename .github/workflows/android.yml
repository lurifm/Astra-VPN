name: Android CI

on:
  push:
    branches: [ main, 'integration/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest build for a branch; rapid UI/engine commits should not
# queue many obsolete Gradle builds.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build debug APK
        # One Gradle invocation shares configuration and compiled outputs between tasks.
        run: gradle testDebugUnitTest assembleDebug

      - name: Verify unsigned debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AstraVPN-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
