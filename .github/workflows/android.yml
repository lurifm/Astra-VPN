name: Android CI

on:
  push:
    branches: [ main, design/reference-ui-pass-1 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest build for a branch; rapid UI/engine commits should not
# queue many obsolete Gradle builds.
concurrency:
  group: android-ci-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify unsigned debug APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          APK_CONTENTS="$(unzip -Z1 "$APK")"
          printf '%s\n' "$APK_CONTENTS" | grep -Fxq 'lib/arm64-v8a/libbox.so'
          if printf '%s\n' "$APK_CONTENTS" | grep -E '^lib/.*\.so$' | grep -v '^lib/arm64-v8a/'; then
            echo "Unexpected native ABI found in APK"
            exit 1
          fi
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AstraVPN-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
